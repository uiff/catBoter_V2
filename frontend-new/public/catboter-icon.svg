    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0FA3C6"/>
      <stop offset="1" stop-color="#07708F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Ohren -->
  <polygon points="202,178 192,104 250,148" fill="#FFFFFF"/>
  <polygon points="310,178 320,104 262,148" fill="#FFFFFF"/>
  <!-- Kopf -->
