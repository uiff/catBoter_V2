<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- CatBoter-Marke: geometrischer Katzenkopf über Napf im iotueli-Petrol.
       Motiv bleibt in der zentralen Safe-Zone (maskable-tauglich). -->
