<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/catboter-icon.svg" />
    <!-- maximum-scale=1 unterbindet den iOS-Auto-Zoom beim Fokussieren von
         Eingabefeldern (verschob die ganze UI); manuelles Pinch-Zoomen in
         Safari bleibt davon unberührt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="CatBoter - Intelligenter Katzenfutterspender mit automatischer Steuerung und Monitoring" />
    <title>CatBoter</title>
    <script>
      // Theme-Init vor dem ersten Paint (verhindert Farb-Flash)
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('catboter.ui') || '{}');
          var theme = (stored.state && stored.state.theme) || 'system';
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* Default: hell */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
