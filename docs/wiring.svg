<svg viewBox="0 0 900 980" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .power { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 11px; fill: #64748b; }
      .pin { font-size: 12px; fill: #334155; }
      .pinR { font-size: 12px; fill: #334155; text-anchor: end; }
      .lbl { font-size: 11px; fill: #64748b; }
      .sect { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
      .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .pwire { fill: none; stroke-width: 3.5; stroke-linecap: round; }
      .warn { font-size: 11px; fill: #b45309; }
    </style>
  </defs>

  <rect width="900" height="980" fill="#f8fafc"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">CatBoter V3 – Verdrahtung</text>
  <text x="450" y="50" text-anchor="middle" class="sub">Signale (BCM-Nummerierung) + komplette Stromversorgung</text>

  <text x="40" y="86" class="sect">SIGNALE</text>

  <!-- Raspberry Pi -->
  <rect x="40" y="100" width="230" height="440" class="box" rx="12"/>
  <text x="155" y="128" text-anchor="middle" class="title">Raspberry Pi</text>
  <text x="155" y="145" text-anchor="middle" class="lbl">40-Pin GPIO Header</text>
  <g>
    <circle cx="262" cy="175" r="4" fill="#dc2626"/><text x="248" y="179" class="pinR">5V (Pin 2)</text>
    <circle cx="262" cy="200" r="4" fill="#ea580c"/><text x="248" y="204" class="pinR">3V3 (Pin 1)</text>
    <circle cx="262" cy="225" r="4" fill="#0f172a"/><text x="248" y="229" class="pinR">GND (Pin 6)</text>

    <circle cx="262" cy="270" r="4" fill="#0891b2"/><text x="248" y="274" class="pinR">GPIO 2 · SDA</text>
    <circle cx="262" cy="295" r="4" fill="#0d9488"/><text x="248" y="299" class="pinR">GPIO 3 · SCL</text>

    <circle cx="262" cy="340" r="4" fill="#7c3aed"/><text x="248" y="344" class="pinR">GPIO 17 · DT</text>
    <circle cx="262" cy="365" r="4" fill="#c026d3"/><text x="248" y="369" class="pinR">GPIO 18 · SCK</text>

    <circle cx="262" cy="420" r="4" fill="#2563eb"/><text x="248" y="424" class="pinR">GPIO 26 · DIR</text>
    <circle cx="262" cy="445" r="4" fill="#16a34a"/><text x="248" y="449" class="pinR">GPIO 21 · STEP/PUL</text>
    <circle cx="262" cy="470" r="4" fill="#d97706"/><text x="248" y="474" class="pinR">GPIO 4 · EN</text>
  </g>

  <!-- VL53L0X -->
  <rect x="560" y="100" width="300" height="115" class="box" rx="10"/>
  <text x="710" y="126" text-anchor="middle" class="title">VL53L0X – Distanzsensor (Tank)</text>
  <g>
    <circle cx="556" cy="145" r="4" fill="#ea580c"/><text x="570" y="149" class="pin">VIN → 3V3</text>
    <circle cx="556" cy="167" r="4" fill="#0f172a"/><text x="570" y="171" class="pin">GND</text>
    <circle cx="556" cy="189" r="4" fill="#0891b2"/><text x="570" y="193" class="pin">SDA</text>
    <circle cx="556" cy="207" r="4" fill="#0d9488"/><text x="570" y="211" class="pin">SCL</text>
  </g>
  <text x="710" y="205" text-anchor="middle" class="lbl">I2C-Adresse 0x29</text>

  <!-- HX711 -->
  <rect x="560" y="240" width="300" height="130" class="box" rx="10"/>
  <text x="710" y="266" text-anchor="middle" class="title">HX711 + Wägezelle (Napf)</text>
  <g>
    <circle cx="556" cy="288" r="4" fill="#dc2626"/><text x="570" y="292" class="pin">VCC → 5V</text>
    <circle cx="556" cy="310" r="4" fill="#0f172a"/><text x="570" y="314" class="pin">GND</text>
    <circle cx="556" cy="332" r="4" fill="#7c3aed"/><text x="570" y="336" class="pin">DT (Data)</text>
    <circle cx="556" cy="354" r="4" fill="#c026d3"/><text x="570" y="358" class="pin">SCK (Clock)</text>
  </g>
  <text x="710" y="330" text-anchor="middle" class="lbl">Wägezelle: E+ E− A+ A−</text>
  <text x="710" y="347" text-anchor="middle" class="lbl">an die 4 Klemmen des HX711</text>

  <!-- Integrierter Motor-Treiber -->
  <rect x="560" y="395" width="300" height="160" class="box" rx="10"/>
  <text x="710" y="421" text-anchor="middle" class="title">NEMA17 mit integriertem Treiber</text>
  <text x="710" y="437" text-anchor="middle" class="sub">„One-Machine-Driver" · DC 11–28 V · 2 A</text>
  <g>
    <circle cx="556" cy="458" r="4" fill="#2563eb"/><text x="570" y="462" class="pin">DIR</text>
    <circle cx="556" cy="480" r="4" fill="#16a34a"/><text x="570" y="484" class="pin">STEP / PUL</text>
    <circle cx="556" cy="502" r="4" fill="#d97706"/><text x="570" y="506" class="pin">EN (LOW = aktiv)</text>
    <circle cx="556" cy="524" r="4" fill="#0f172a"/><text x="570" y="528" class="pin">GND (Logik, gemeinsam mit Pi!)</text>
  </g>
  <g>
    <circle cx="864" cy="480" r="4" fill="#dc2626"/><text x="852" y="484" class="pinR">V+ 24 V ⚡</text>
    <circle cx="864" cy="502" r="4" fill="#0f172a"/><text x="852" y="506" class="pinR">V− / GND ⚡</text>
  </g>
  <text x="710" y="546" text-anchor="middle" class="lbl">Treiber sitzt direkt auf dem Motor – kein separates Treiberboard</text>

  <!-- Signal-Drähte -->
  <path class="wire" stroke="#ea580c" d="M266 200 C 400 200, 430 145, 552 145"/>
  <path class="wire" stroke="#0f172a" d="M266 225 C 390 225, 430 167, 552 167"/>
  <path class="wire" stroke="#0891b2" d="M266 270 C 400 270, 440 189, 552 189"/>
  <path class="wire" stroke="#0d9488" d="M266 295 C 400 295, 440 207, 552 207"/>

  <path class="wire" stroke="#dc2626" d="M266 175 C 420 175, 460 288, 552 288"/>
  <path class="wire" stroke="#0f172a" d="M266 225 C 390 230, 460 310, 552 310"/>
  <path class="wire" stroke="#7c3aed" d="M266 340 C 400 340, 440 332, 552 332"/>
  <path class="wire" stroke="#c026d3" d="M266 365 C 400 365, 440 354, 552 354"/>

  <path class="wire" stroke="#2563eb" d="M266 420 C 400 420, 440 458, 552 458"/>
  <path class="wire" stroke="#16a34a" d="M266 445 C 400 445, 440 480, 552 480"/>
  <path class="wire" stroke="#d97706" d="M266 470 C 400 470, 440 502, 552 502"/>
  <path class="wire" stroke="#0f172a" d="M266 225 C 380 235, 450 524, 552 524"/>

  <!-- STROMVERSORGUNG -->
  <text x="40" y="610" class="sect">STROMVERSORGUNG</text>

  <!-- Steckdose -->
  <rect x="40" y="630" width="180" height="90" class="power" rx="10"/>
  <text x="130" y="658" text-anchor="middle" class="title">Steckdose</text>
  <text x="130" y="676" text-anchor="middle" class="lbl">230 V AC</text>
  <text x="130" y="696" text-anchor="middle" class="warn">⚠ keine offene Verdrahtung –</text>
  <text x="130" y="710" text-anchor="middle" class="warn">geschlossenes Steckernetzteil</text>

  <!-- 24V Netzteil -->
  <rect x="300" y="630" width="220" height="90" class="power" rx="10"/>
  <text x="410" y="658" text-anchor="middle" class="title">Steckernetzteil 24 V</text>
  <text x="410" y="676" text-anchor="middle" class="lbl">DC 24 V, min. 3 A empfohlen</text>
  <text x="410" y="694" text-anchor="middle" class="lbl">(Motor 2 A + Pi über Wandler)</text>
  <circle cx="524" cy="662" r="4" fill="#dc2626"/><text x="512" y="652" class="pinR">+24 V</text>
  <circle cx="524" cy="692" r="4" fill="#0f172a"/><text x="512" y="710" class="pinR">GND</text>

  <!-- Verteilung -->
  <rect x="600" y="630" width="120" height="90" class="power" rx="10"/>
  <text x="660" y="660" text-anchor="middle" class="title">Verteiler</text>
  <text x="660" y="678" text-anchor="middle" class="lbl">Klemme /</text>
  <text x="660" y="692" text-anchor="middle" class="lbl">Wago</text>

  <!-- Buck Converter -->
  <rect x="300" y="770" width="280" height="100" class="power" rx="10"/>
  <text x="440" y="796" text-anchor="middle" class="title">DC-DC Step-Down 24 V → 5 V</text>
  <text x="440" y="813" text-anchor="middle" class="lbl">Buck-Converter, min. 3 A für den Pi</text>
  <text x="440" y="830" text-anchor="middle" class="lbl">Ausgang per USB-Adapter an den Pi</text>
  <circle cx="296" cy="800" r="4" fill="#dc2626"/><text x="310" y="792" class="pin">IN +24 V</text>
  <circle cx="296" cy="830" r="4" fill="#0f172a"/><text x="310" y="844" class="pin">IN GND</text>
  <circle cx="584" cy="800" r="4" fill="#dc2626"/><text x="572" y="792" class="pinR">OUT 5 V</text>
  <circle cx="584" cy="830" r="4" fill="#0f172a"/><text x="572" y="844" class="pinR">OUT GND</text>

  <!-- Pi Power -->
  <rect x="680" y="770" width="180" height="100" class="power" rx="10"/>
  <text x="770" y="800" text-anchor="middle" class="title">Raspberry Pi</text>
  <text x="770" y="818" text-anchor="middle" class="lbl">USB-C 5 V / 3 A</text>

  <!-- Power-Drähte -->
  <path class="pwire" stroke="#475569" d="M220 675 L 300 675"/>
  <path class="pwire" stroke="#dc2626" d="M528 662 C 560 662, 570 655, 600 655"/>
  <path class="pwire" stroke="#0f172a" d="M528 692 C 560 692, 570 700, 600 700"/>
  <!-- Verteiler -> Motor V+ (nach oben) -->
  <path class="pwire" stroke="#dc2626" d="M690 630 C 700 580, 830 540, 862 484"/>
  <path class="pwire" stroke="#0f172a" d="M710 630 C 725 590, 845 555, 862 506"/>
  <!-- Verteiler -> Buck -->
  <path class="pwire" stroke="#dc2626" d="M620 720 C 560 750, 400 760, 296 798"/>
  <path class="pwire" stroke="#0f172a" d="M645 720 C 590 765, 420 775, 296 828"/>
  <!-- Buck -> Pi -->
  <path class="pwire" stroke="#dc2626" d="M588 800 C 630 800, 645 805, 680 805"/>
  <path class="pwire" stroke="#0f172a" d="M588 830 C 630 830, 645 835, 680 835"/>

  <text x="450" y="905" text-anchor="middle" class="lbl">Alle GND verbinden: Pi, HX711, VL53L0X, Treiber-Logik-GND und Netzteil-Minus (gemeinsame Masse).</text>
  <text x="450" y="922" text-anchor="middle" class="lbl">Motor-Versorgung (24 V, dicke Leitungen ⚡) getrennt von den Signal-Leitungen führen. I2C in raspi-config aktivieren.</text>
  <text x="450" y="945" text-anchor="middle" class="warn">⚠ Verpolungsschutz beachten: erst GND, dann V+ anschliessen. Pi nie direkt an 24 V!</text>
</svg>
