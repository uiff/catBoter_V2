<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .pin { font-size: 12px; fill: #334155; }
      .pinR { font-size: 12px; fill: #334155; text-anchor: end; }
      .lbl { font-size: 11px; fill: #64748b; }
      .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .wlbl { font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="900" height="640" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">CatBoter V3 – Verdrahtung (BCM-Nummerierung)</text>

  <!-- Raspberry Pi -->
  <rect x="40" y="70" width="230" height="500" class="box" rx="12"/>
  <text x="155" y="100" text-anchor="middle" class="title">Raspberry Pi</text>
  <text x="155" y="118" text-anchor="middle" class="lbl">40-Pin GPIO Header</text>

  <!-- Pi Pins (rechte Kante) -->
  <g>
    <circle cx="262" cy="150" r="4" fill="#dc2626"/><text x="248" y="154" class="pinR">5V (Pin 2)</text>
    <circle cx="262" cy="180" r="4" fill="#ea580c"/><text x="248" y="184" class="pinR">3V3 (Pin 1)</text>
    <circle cx="262" cy="210" r="4" fill="#0f172a"/><text x="248" y="214" class="pinR">GND (Pin 6)</text>

    <circle cx="262" cy="260" r="4" fill="#0891b2"/><text x="248" y="264" class="pinR">GPIO 2 · SDA</text>
    <circle cx="262" cy="290" r="4" fill="#0d9488"/><text x="248" y="294" class="pinR">GPIO 3 · SCL</text>

    <circle cx="262" cy="340" r="4" fill="#7c3aed"/><text x="248" y="344" class="pinR">GPIO 17 · DT</text>
    <circle cx="262" cy="370" r="4" fill="#c026d3"/><text x="248" y="374" class="pinR">GPIO 18 · SCK</text>

    <circle cx="262" cy="430" r="4" fill="#2563eb"/><text x="248" y="434" class="pinR">GPIO 26 · DIR</text>
    <circle cx="262" cy="460" r="4" fill="#16a34a"/><text x="248" y="464" class="pinR">GPIO 21 · STEP</text>
    <circle cx="262" cy="490" r="4" fill="#d97706"/><text x="248" y="494" class="pinR">GPIO 4 · EN</text>
  </g>

  <!-- VL53L0X -->
  <rect x="560" y="120" width="300" height="130" class="box"/>
  <text x="710" y="148" text-anchor="middle" class="title">VL53L0X – Distanzsensor (Tank)</text>
  <g>
    <circle cx="556" cy="170" r="4" fill="#ea580c"/><text x="570" y="174" class="pin">VIN → 3V3</text>
    <circle cx="556" cy="195" r="4" fill="#0f172a"/><text x="570" y="199" class="pin">GND</text>
    <circle cx="556" cy="220" r="4" fill="#0891b2"/><text x="570" y="224" class="pin">SDA</text>
    <circle cx="556" cy="242" r="4" fill="#0d9488"/><text x="570" y="246" class="pin">SCL</text>
  </g>
  <text x="710" y="240" text-anchor="middle" class="lbl">misst Füllstand über I2C (0x29)</text>

  <!-- HX711 -->
  <rect x="560" y="280" width="300" height="150" class="box"/>
  <text x="710" y="308" text-anchor="middle" class="title">HX711 + Wägezelle (Napf)</text>
  <g>
    <circle cx="556" cy="330" r="4" fill="#dc2626"/><text x="570" y="334" class="pin">VCC → 5V</text>
    <circle cx="556" cy="352" r="4" fill="#0f172a"/><text x="570" y="356" class="pin">GND</text>
    <circle cx="556" cy="374" r="4" fill="#7c3aed"/><text x="570" y="378" class="pin">DT (Data)</text>
    <circle cx="556" cy="396" r="4" fill="#c026d3"/><text x="570" y="400" class="pin">SCK (Clock)</text>
  </g>
  <text x="710" y="392" text-anchor="middle" class="lbl">Wägezelle: E+ E− A+ A−</text>
  <text x="710" y="410" text-anchor="middle" class="lbl">an die 4 Klemmen des HX711</text>

  <!-- Stepper Driver -->
  <rect x="560" y="460" width="300" height="150" class="box"/>
  <text x="710" y="488" text-anchor="middle" class="title">Schrittmotor-Treiber (A4988/DRV8825)</text>
  <g>
    <circle cx="556" cy="510" r="4" fill="#2563eb"/><text x="570" y="514" class="pin">DIR</text>
    <circle cx="556" cy="532" r="4" fill="#16a34a"/><text x="570" y="536" class="pin">STEP</text>
    <circle cx="556" cy="554" r="4" fill="#d97706"/><text x="570" y="558" class="pin">ENABLE (LOW = aktiv)</text>
    <circle cx="556" cy="576" r="4" fill="#0f172a"/><text x="570" y="580" class="pin">GND (Logik)</text>
  </g>
  <text x="710" y="545" text-anchor="middle" class="lbl">NEMA17 (US-17HS4401S)</text>
  <text x="710" y="563" text-anchor="middle" class="lbl">an 1A/1B/2A/2B</text>
  <text x="710" y="596" text-anchor="middle" class="lbl">VMOT: 12 V Netzteil + 100 µF Elko, GND gemeinsam!</text>

  <!-- Drähte Pi -> VL53L0X -->
  <path class="wire" stroke="#ea580c" d="M266 180 C 400 180, 430 170, 552 170"/>
  <path class="wire" stroke="#0f172a" d="M266 210 C 390 210, 430 195, 552 195"/>
  <path class="wire" stroke="#0891b2" d="M266 260 C 400 260, 440 220, 552 220"/>
  <path class="wire" stroke="#0d9488" d="M266 290 C 400 290, 440 242, 552 242"/>

  <!-- Drähte Pi -> HX711 -->
  <path class="wire" stroke="#dc2626" d="M266 150 C 420 150, 460 330, 552 330"/>
  <path class="wire" stroke="#0f172a" d="M266 210 C 390 215, 460 352, 552 352"/>
  <path class="wire" stroke="#7c3aed" d="M266 340 C 400 340, 440 374, 552 374"/>
  <path class="wire" stroke="#c026d3" d="M266 370 C 400 370, 440 396, 552 396"/>

  <!-- Drähte Pi -> Treiber -->
  <path class="wire" stroke="#2563eb" d="M266 430 C 400 430, 440 510, 552 510"/>
  <path class="wire" stroke="#16a34a" d="M266 460 C 400 460, 440 532, 552 532"/>
  <path class="wire" stroke="#d97706" d="M266 490 C 400 490, 440 554, 552 554"/>
  <path class="wire" stroke="#0f172a" d="M266 210 C 380 220, 450 576, 552 576"/>

  <text x="450" y="628" text-anchor="middle" class="lbl">Alle GND verbinden (Pi, HX711, VL53L0X, Treiber-Logik, Motor-Netzteil) · I2C in raspi-config aktivieren</text>
</svg>
